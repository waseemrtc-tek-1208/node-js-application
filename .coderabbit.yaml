language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: true   # makes CodeRabbit submit real Approve/Request-changes reviews, not just comments
  review_status: true

  auto_review:
    enabled: true
    auto_incremental_review: true  # re-reviews automatically when you push fixes
    drafts: false
    base_branches:
      - "develop"                  # only auto-reviews PRs targeting this branch

  pre_merge_checks:
    custom_checks:
      - name: "No critical issues"
        mode: "error"
        instructions: "Fail if the code review identified any security vulnerability, critical bug, or logic error in the diff."

chat:
  auto_reply: true
