language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: true   # makes CodeRabbit submit real Approve/Request-changes reviews, not just comments
  review_status: true

  auto_review:
    enabled: true
    auto_incremental_review: true  # re-reviews automatically when you push fixes
    drafts: false
    base_branches:
      - "develop"                  # only auto-reviews PRs targeting this branch

  # pre_merge_checks:                # optional extra gates beyond code-quality review
  #   title:
  #     mode: "off"
  #   description:
  #     mode: "off"
  #   docstring_coverage:
  #     mode: "off"
  #   custom_checks: []

chat:
  auto_reply: true
